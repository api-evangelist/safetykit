aid: safetykit
name: SafetyKit
description: 'SafetyKit is an AI trust, safety, and fraud-detection platform that lets
  marketplaces, fintechs, and social and creator platforms deploy AI agents to automate
  risk reviews, onboarding, and investigations. Its Data API ingests every user action
  and object through a lightweight SDK and API, organizes them into per-workflow namespaces,
  and asynchronously returns agent decisions — labels, risk scores, and enforcement
  actions such as account suspension — delivered back over signed webhooks. SafetyKit
  detects account takeover, multi-accounting, fake accounts, phishing, spam, harmful
  content, scams, and prohibited listings, and is used by companies including Upwork,
  Etsy, Eventbrite, Lyft, Discord, and Kickstarter.'
